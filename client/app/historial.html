<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial de Tasaciones</title>

    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/shell.css">
    <link rel="stylesheet" href="../css/tasacion.css">
    <link rel="stylesheet" href="../css/historial.css">
    <link rel="stylesheet" href="../css/compartir.css">

    <script>
        // Aplicar estado del sidebar antes del primer render para evitar salto visual
        (function() {
            const savedState = localStorage.getItem('sidebarCollapsed');
            if (savedState === 'true') {
                document.documentElement.classList.add('sidebar-collapsed-initial');
            }
        })();
    </script>
</head>
<body>
    <aside class="sidebar" id="sidebar" aria-label="Menú lateral">
        <div class="sidebar-logo">
            <div class="sidebar-logo-img">
                <i class="fa-solid fa-home"></i>
            </div>
            <span class="sidebar-logo-text">Tasador</span>
        </div>

        <button type="button" class="sidebar-toggle" id="sidebarToggle" aria-label="Minimizar/expandir menú">
            <i class="fa-solid fa-chevron-left"></i>
        </button>

        <nav class="sidebar-nav">
            <a href="index.html" class="sidebar-nav-item" data-page="inicio">
                <span class="sidebar-nav-item-icon">
                    <i class="fa-solid fa-house"></i>
                </span>
                <span class="sidebar-nav-item-text">Inicio</span>
            </a>

            <a href="historial.html" class="sidebar-nav-item active" data-page="historial">
                <span class="sidebar-nav-item-icon">
                    <i class="fa-solid fa-clock-rotate-left"></i>
                </span>
                <span class="sidebar-nav-item-text">Base de datos</span>
            </a>

            <a href="tasacion.html" class="sidebar-nav-item" data-page="tasacion">
                <span class="sidebar-nav-item-icon">
                    <i class="fa-solid fa-plus"></i>
                </span>
                <span class="sidebar-nav-item-text">Nueva tasación</span>
            </a>
        </nav>

        <div class="sidebar-divider"></div>

        <button type="button" class="sidebar-nav-item" id="appearanceBtn" aria-label="Apariencia">
            <span class="sidebar-nav-item-icon">
                <i class="fa-solid fa-palette"></i>
            </span>
            <span class="sidebar-nav-item-text">Apariencia</span>
        </button>

        <button type="button" class="sidebar-profile" aria-label="Perfil de usuario">
            <div class="sidebar-profile-avatar">
                <i class="fa-solid fa-user"></i>
            </div>
            <div class="sidebar-profile-info">
                <span class="sidebar-profile-name">Usuario</span>
            </div>
        </button>
    </aside>

    <div class="main-layout" id="mainLayout">
        <div class="main-content" id="mainContent">

    <section class="historial-section" aria-label="Historial">

        <div class="historial-container">

            <div class="historial-content">

                <div class="historial-panel-izquierdo">

                    <div class="historial-header">

                        <input
                            type="text"
                            placeholder="Dirección o código de propiedad"
                            class="input-busqueda">

                        <div class="historial-filtros">
                            <div class="segmented-control" role="tablist" aria-label="Tipo de registro">
                                <div class="segmented-pill"></div>
                                <button type="button" class="btn-segment active" data-registro="tasaciones">Tasaciones</button>
                                <button type="button" class="btn-segment" data-registro="comparables">Comparables</button>
                            </div>

                            <div class="filtros-derecha">
                                <div class="filtro-grupo">
                                    <label for="historialFiltroTipo" class="filtro-label">Tipo:</label>
                                    <div class="autocomplete-container" style="width: 100%;">
                                        <input type="text" class="filtro-select" id="historialFiltroTipo" value="Todos" data-value="todos" readonly>
                                        <div class="autocomplete-list" id="historialFiltroTipoList">
                                            <div class="autocomplete-item" data-value="todos">Todos</div>
                                            <div class="autocomplete-item" data-value="lote">Lotes</div>
                                            <div class="autocomplete-item" data-value="ph">PH</div>
                                            <div class="autocomplete-item" data-value="casa">Casas</div>
                                        </div>
                                    </div>
                                </div>

                                <div class="filtro-grupo">
                                    <label for="historialFiltroEstado" class="filtro-label">Estado:</label>
                                    <div class="autocomplete-container" style="width: 100%;">
                                        <input type="text" class="filtro-select" id="historialFiltroEstado" value="Todos" data-value="todos" readonly>
                                        <div class="autocomplete-list" id="historialFiltroEstadoList">
                                            <div class="autocomplete-item" data-value="todos">Todos</div>
                                            <div class="autocomplete-item" data-value="completada">Completadas</div>
                                            <div class="autocomplete-item" data-value="borrador">Borradores</div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                    </div>

                    <div class="lista-propiedades"></div>

                </div>

                <div class="historial-panel-derecho">
                    <div id="map"></div>
                </div>

            </div>

        </div>

    </section>
    </div>
    </div>

    <div class="modal-overlay" id="comparablesModalOverlay">

        <div class="modal-tasacion" id="comparablesModalTasacion">

            <button
                type="button"
                class="cerrar-modal"
                id="comparablesModalCerrar"
                aria-label="Cerrar">
                ✕
            </button>

            <div id="comparablesModalContenido"></div>

        </div>

    </div>

    <div class="modal-overlay" id="modalOverlay">

        <div class="modal-tasacion" id="modalTasacion">

            <button
                type="button"
                class="cerrar-modal"
                id="cerrarModal"
                aria-label="Cerrar">
                ✕
            </button>

            <div id="contenidoModal"></div>

        </div>

    </div>

    <!-- Modal Genérico Reutilizable -->
    <div class="modal-overlay" id="modalGenerico">
        <div class="modal-confirmacion-salir">
            <h2 class="modal-titulo"></h2>
            <p class="modal-mensaje"></p>
            <div class="modal-confirmacion-botones modal-botones"></div>
        </div>
    </div>

    <!-- Modal para compartir tasación -->
    <div class="modal-overlay" id="modalCompartir">
        <div class="modal-confirmacion-salir modal-compartir">
            <h2 class="modal-titulo">Compartir tasación</h2>
            <p class="modal-mensaje" id="compartirMensaje">Compartí esta tasación mediante un enlace.</p>

            <div class="compartir-contenido" id="compartirContenido" style="display: none;">
                <input type="text" id="compartirLink" class="compartir-input" readonly>
                <div class="compartir-acciones">
                    <button type="button" class="compartir-btn compartir-btn-copiar" id="btnCopiarLink">
                        <i class="fa-solid fa-copy"></i> Copiar enlace
                    </button>
                    <a class="compartir-btn compartir-btn-whatsapp" id="btnCompartirWhatsapp" target="_blank" rel="noopener">
                        <i class="fa-brands fa-whatsapp"></i> WhatsApp
                    </a>
                    <a class="compartir-btn compartir-btn-email" id="btnCompartirEmail">
                        <i class="fa-solid fa-envelope"></i> Email
                    </a>
                </div>
                <button type="button" class="compartir-btn-revocar" id="btnRevocarLink">
                    Revocar enlace
                </button>
            </div>

            <div class="modal-confirmacion-botones modal-botones" id="compartirBotonesInicio">
                <button type="button" class="btn-cancelar" id="btnCerrarCompartir">Cerrar</button>
                <button type="button" class="btn-confirmar" id="btnGenerarLink">Generar enlace</button>
            </div>
        </div>
    </div>

    <script src="https://kit.fontawesome.com/d853729d1d.js" crossorigin="anonymous"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

    <script src="../js/route-guard.js"></script>
    <script src="../js/sidebar.js"></script>
    <script src="../js/api-client.js"></script>
    <script src="../js/entidades.js"></script>
    <script src="../js/global.js"></script>
    <script src="../js/storage-cache.js"></script>
    <script src="../js/modal-generico.js"></script>
    <script src="../js/config/resultados-config.js"></script>
    <script src="../js/resultados-renderer.js"></script>
    <script src="../js/homogeneizacion-superficie.js"></script>
    <script src="../js/event-manager.js"></script>
    <script src="../js/historial.js"></script>
    <script src="../js/compartir.js"></script>
    <script src="../js/theme.js"></script>

    <!-- Modal de selección de tema -->
    <div class="theme-modal" id="themeModal" style="display: none;">
        <div class="theme-modal-content">
            <div class="theme-modal-header">
                <h3>Apariencia</h3>
                <button type="button" class="theme-modal-close" id="themeModalClose" aria-label="Cerrar">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="theme-modal-body">
                <button type="button" class="theme-option" id="lightThemeBtn" data-theme="light">
                    <div class="theme-option-preview theme-option-light">
                        <div class="theme-option-circle">
                            <i class="fa-solid fa-sun"></i>
                        </div>
                        <span class="theme-option-text">Modo claro</span>
                    </div>
                </button>
                <button type="button" class="theme-option" id="darkThemeBtn" data-theme="dark">
                    <div class="theme-option-preview theme-option-dark">
                        <div class="theme-option-circle">
                            <i class="fa-solid fa-moon"></i>
                        </div>
                        <span class="theme-option-text">Modo oscuro</span>
                    </div>
                </button>
            </div>
        </div>
    </div>

</body>
</html>
