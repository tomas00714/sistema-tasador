<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil</title>

    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/shell.css">
    <link rel="stylesheet" href="../css/tasacion.css">
    <link rel="stylesheet" href="../css/historial.css">
    <link rel="stylesheet" href="../css/perfil.css">

    <script>
        (function() {
            const savedState = localStorage.getItem('sidebarCollapsed');
            if (savedState === 'true') {
                document.documentElement.classList.add('sidebar-collapsed-initial');
            }
        })();
    </script>
</head>
<body>
    <aside class="sidebar" id="sidebar" aria-label="Menú lateral">
        <div class="sidebar-logo">
            <div class="sidebar-logo-img">
                <i class="fa-solid fa-home"></i>
            </div>
            <span class="sidebar-logo-text">Tasador</span>
        </div>

        <button type="button" class="sidebar-toggle" id="sidebarToggle" aria-label="Minimizar/expandir menú">
            <i class="fa-solid fa-chevron-left"></i>
        </button>

        <nav class="sidebar-nav">
            <a href="index.html" class="sidebar-nav-item" data-page="inicio">
                <span class="sidebar-nav-item-icon">
                    <i class="fa-solid fa-house"></i>
                </span>
                <span class="sidebar-nav-item-text">Inicio</span>
            </a>

            <a href="historial.html" class="sidebar-nav-item" data-page="historial">
                <span class="sidebar-nav-item-icon">
                    <i class="fa-solid fa-clock-rotate-left"></i>
                </span>
                <span class="sidebar-nav-item-text">Base de datos</span>
            </a>

            <a href="solicitudes.html" class="sidebar-nav-item" data-page="solicitudes">
                <span class="sidebar-nav-item-icon">
                    <i class="fa-solid fa-hand-holding-heart"></i>
                </span>
                <span class="sidebar-nav-item-text">Solicitudes</span>
            </a>

            <a href="tasacion.html" class="sidebar-nav-item" data-page="tasacion">
                <span class="sidebar-nav-item-icon">
                    <i class="fa-solid fa-plus"></i>
                </span>
                <span class="sidebar-nav-item-text">Nueva tasación</span>
            </a>
        </nav>

        <div class="sidebar-divider"></div>

        <button type="button" class="sidebar-nav-item" id="appearanceBtn" aria-label="Apariencia">
            <span class="sidebar-nav-item-icon">
                <i class="fa-solid fa-palette"></i>
            </span>
            <span class="sidebar-nav-item-text">Apariencia</span>
        </button>

        <button type="button" class="sidebar-profile" data-page="perfil" aria-label="Perfil de usuario">
            <div class="sidebar-profile-avatar">
                <i class="fa-solid fa-user"></i>
            </div>
            <div class="sidebar-profile-info">
                <span class="sidebar-profile-name">Usuario</span>
            </div>
        </button>
    </aside>

    <div class="main-layout" id="mainLayout">
        <div class="main-content" id="mainContent">

            <div class="perfil-card" id="perfilCard">

                <div class="perfil-header">
                    <div class="perfil-avatar-container">
                        <div class="perfil-avatar" id="perfilAvatar">
                            <img id="perfilAvatarImg" src="" alt="Foto de perfil" style="display: none;">
                            <i class="fa-solid fa-user" id="perfilAvatarIcon"></i>
                            <div class="perfil-avatar-overlay" id="avatarOverlay">
                                <i class="fa-solid fa-camera"></i>
                                <span>Cambiar foto</span>
                            </div>
                        </div>
                        <input type="file" id="inputFotoPerfil" accept="image/png,image/jpeg,image/gif,image/webp" style="display: none;">
                    </div>
                    <div class="perfil-info">
                        <h1 class="perfil-nombre" id="perfilNombre">Usuario</h1>
                        <p class="perfil-email" id="perfilEmail">usuario@ejemplo.com</p>
                        <div class="perfil-meta">
                            <span class="perfil-badge" id="perfilPlanBadge">Free</span>
                        </div>
                    </div>
                </div>

                <div class="perfil-divider"></div>

                <div class="perfil-section-body" id="perfilDatosSection">
                    <div class="perfil-section-title-row">
                        <h2 class="perfil-section-title">Datos</h2>
                        <div class="perfil-actions" id="perfilAccionesNormal">
                            <button type="button" class="perfil-btn-editar" id="btnEditarPerfil">
                                <i class="fa-solid fa-pen"></i> Editar perfil
                            </button>
                        </div>
                        <div class="perfil-actions" id="perfilAccionesEdicion">
                            <button type="button" class="perfil-btn-editar" id="btnCancelarEdicion">
                                Cancelar
                            </button>
                            <button type="button" class="perfil-btn-editar" id="btnGuardarCambios">
                                <i class="fa-solid fa-save"></i> Guardar cambios
                            </button>
                        </div>
                    </div>

                    <div class="perfil-datos-grid">

                        <div class="perfil-dato-row" data-editable="false">
                            <div class="perfil-dato-label">Nombre</div>
                            <div class="perfil-dato-contenido">
                                <span class="perfil-dato-valor" id="verNombre">—</span>
                            </div>
                        </div>

                        <div class="perfil-dato-row" data-editable="false">
                            <div class="perfil-dato-label">Apellido</div>
                            <div class="perfil-dato-contenido">
                                <span class="perfil-dato-valor" id="verApellido">—</span>
                            </div>
                        </div>

                        <div class="perfil-dato-row" data-editable="false">
                            <div class="perfil-dato-label">Email</div>
                            <div class="perfil-dato-contenido">
                                <span class="perfil-dato-valor" id="verEmail">—</span>
                            </div>
                        </div>

                        <div class="perfil-dato-row" data-editable="true">
                            <div class="perfil-dato-label">Matrícula</div>
                            <div class="perfil-dato-contenido">
                                <span class="perfil-dato-valor" id="verMatricula">—</span>
                                <input type="text" id="inputMatricula" class="perfil-input" placeholder="Ej: CPI 1234">
                            </div>
                        </div>

                        <div class="perfil-dato-row" data-editable="true">
                            <div class="perfil-dato-label">Teléfono</div>
                            <div class="perfil-dato-contenido">
                                <span class="perfil-dato-valor" id="verTelefono">—</span>
                                <input type="text" id="inputTelefono" class="perfil-input" placeholder="Ej: +54 9 11 1234-5678">
                            </div>
                        </div>

                    </div>

                    <div id="mensajeProfesional" style="display: none; margin-top: 12px; color: #16a34a; font-size: 0.9rem;"></div>
                    <div id="errorProfesional" style="display: none; margin-top: 12px; color: #dc2626; font-size: 0.9rem;"></div>
                </div>

                <div class="perfil-divider"></div>

                <div class="perfil-section-body" id="perfilInmobiliariaSection">
                    <h2 class="perfil-section-title">Inmobiliaria</h2>

                    <div class="perfil-inmobiliaria-card">
                        <div class="perfil-inmobiliaria-info">
                            <div class="perfil-dato-label">Nombre</div>
                            <div class="perfil-inmobiliaria-nombre" id="verNombreInmobiliaria">—</div>
                            <input type="text" id="inputNombreInmobiliaria" class="perfil-input" placeholder="Nombre de la inmobiliaria">
                        </div>

                        <div class="perfil-inmobiliaria-logo" id="logoInmobiliaria">
                            <img id="logoInmobiliariaImg" src="" alt="Logo" style="display: none;">
                            <i class="fa-solid fa-building" id="logoInmobiliariaIcon"></i>
                            <div class="perfil-logo-overlay" id="logoOverlay">
                                <i class="fa-solid fa-camera"></i>
                                <span>Cambiar logo</span>
                            </div>
                            <input type="file" id="inputLogoInmobiliaria" accept="image/png,image/jpeg,image/gif,image/webp" style="display: none;">
                        </div>
                    </div>
                </div>

                <div class="perfil-divider"></div>

                <div class="perfil-section-body" id="perfilCuentaSection">
                    <h2 class="perfil-section-title">Cuenta</h2>

                    <div class="perfil-datos-grid">
                        <div class="perfil-dato-row" data-editable="false">
                            <div class="perfil-dato-label">Email</div>
                            <div class="perfil-dato-contenido">
                                <span class="perfil-dato-valor" id="verEmailCuenta">—</span>
                            </div>
                        </div>

                        <div class="perfil-dato-row" data-editable="false">
                            <div class="perfil-dato-label">Google</div>
                            <div class="perfil-dato-contenido" id="estadoGoogleCuenta">
                                <span class="perfil-dato-valor" id="verEstadoGoogle">No vinculada</span>
                            </div>
                        </div>
                    </div>

                    <div class="perfil-cuenta-acciones" id="perfilCuentaAcciones">
                        <button type="button" class="perfil-btn-google" id="btnVincularGoogle">
                            <i class="fa-brands fa-google"></i> Vincular con Google
                        </button>
                        <button type="button" class="perfil-btn-google perfil-btn-google--desvincular" id="btnDesvincularGoogle" style="display: none;">
                            <i class="fa-brands fa-google"></i> Desvincular Google
                        </button>
                    </div>
                </div>

            </div>

        </div>
    </div>

    <script src="https://kit.fontawesome.com/d853729d1d.js" crossorigin="anonymous"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script src="../js/route-guard.js"></script>
    <script src="../js/sidebar.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/theme.js"></script>
    <script src="../js/api-client.js"></script>
    <script src="../js/perfil.js"></script>
</body>
</html>
