<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Sistema de Tasaciones</title>

    <link rel="stylesheet" href="css/global.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script src="https://kit.fontawesome.com/d853729d1d.js" crossorigin="anonymous"></script>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-logo">
                    <i class="fa-solid fa-home"></i>
                </div>
                <h1 class="auth-title">Sistema de Tasaciones</h1>
                <p class="auth-subtitle">Crea tu cuenta para comenzar</p>
            </div>

            <form class="auth-form" id="registerForm">
                <div class="form-group">
                    <label for="nombre">Nombre</label>
                    <input
                        type="text"
                        id="nombre"
                        name="nombre"
                        required
                        placeholder="Tu nombre"
                        autocomplete="given-name">
                </div>

                <div class="form-group">
                    <label for="apellido">Apellido</label>
                    <input
                        type="text"
                        id="apellido"
                        name="apellido"
                        required
                        placeholder="Tu apellido"
                        autocomplete="family-name">
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        required
                        placeholder="tu@email.com"
                        autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <div class="password-input-wrapper">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            required
                            placeholder="••••••••"
                            autocomplete="new-password"
                            minlength="8">
                        <button type="button" class="password-toggle" data-target="password" aria-label="Mostrar contraseña">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                    <small class="form-hint">Mínimo 8 caracteres, al menos una mayúscula</small>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirmar Contraseña</label>
                    <div class="password-input-wrapper">
                        <input
                            type="password"
                            id="confirmPassword"
                            name="confirmPassword"
                            required
                            placeholder="••••••••"
                            autocomplete="new-password">
                        <button type="button" class="password-toggle" data-target="confirmPassword" aria-label="Mostrar contraseña">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                    <small class="form-hint" id="confirmPasswordHint"></small>
                </div>

                <button type="submit" class="btn btn-primary btn-full" id="registerBtn">
                    Crear Cuenta
                </button>

                <div class="auth-divider">
                    <span>o continúa con</span>
                </div>

                <button type="button" class="btn btn-secondary btn-full" disabled>
                    <i class="fa-brands fa-google"></i>
                    Google
                </button>

                <div class="auth-footer">
                    <p>¿Ya tienes una cuenta? <a href="login.html" class="auth-link">Inicia sesión</a></p>
                </div>
            </form>

            <div class="auth-error" id="authError" style="display: none;"></div>
        </div>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
